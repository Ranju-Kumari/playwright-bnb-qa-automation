name: Playwright Tests

on:
  push:
    branches: [ '**' ]          # run on every branch
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:            # allow manual runs from the Actions tab

# Only read access to the repo is needed
permissions:
  contents: read

# A new push to the same branch cancels the older, still-running pipeline
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: lts/*

jobs:
  # Stage 1: fast checks that catch broken code before any test runs
  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

  # Stage 2a: API tests (no browser needed)
  api-tests:
    name: API tests
    needs: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run API tests
        run: npx playwright test --project=api
        env:
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

      - name: Upload API test report
        uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: api-test-report
          path: playwright-report/
          retention-days: 30

  # Stage 2b: UI tests in Chromium (runs in parallel with API tests)
  ui-tests:
    name: UI tests (Chromium)
    needs: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run UI tests
        run: npx playwright test --project=chromium
        env:
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

      - name: Upload UI test report
        uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: ui-test-report
          path: |
            playwright-report/
            test-results/
          retention-days: 30
